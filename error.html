<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Page not found - CloudCraft"
  >

  <title>404 | Page Not Found</title>

  <style>

    /* =========================
       GLOBAL
    ========================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #070b17;
      --text: #f5f7ff;
      --muted: #aab4cf;

      --primary: #8b5cf6;
      --secondary: #22d3ee;

      --border: rgba(255, 255, 255, 0.12);
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:

        radial-gradient(
          circle at 15% 20%,
          rgba(139, 92, 246, 0.20),
          transparent 30%
        ),

        radial-gradient(
          circle at 85% 20%,
          rgba(34, 211, 238, 0.15),
          transparent 28%
        ),

        radial-gradient(
          circle at 50% 100%,
          rgba(139, 92, 246, 0.10),
          transparent 35%
        ),

        var(--bg);

      color: var(--text);

      min-height: 100vh;

      display: flex;
      flex-direction: column;

      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }


    /* =========================
       BACKGROUND GLOW
    ========================== */

    .glow {

      position: fixed;

      width: 350px;
      height: 350px;

      border-radius: 50%;

      filter: blur(110px);

      opacity: 0.20;

      pointer-events: none;

      z-index: 0;

      animation:
        floating 8s ease-in-out infinite
        alternate;
    }

    .glow-one {

      background: var(--primary);

      top: -180px;
      left: -120px;
    }

    .glow-two {

      background: var(--secondary);

      bottom: -180px;
      right: -120px;

      animation-delay: -3s;
    }

    @keyframes floating {

      from {
        transform: translateY(-20px);
      }

      to {
        transform: translateY(35px);
      }

    }


    /* =========================
       NAVBAR
    ========================== */

    nav {

      position: relative;

      z-index: 10;

      width: min(
        1100px,
        calc(100% - 32px)
      );

      margin: 18px auto 0;

      padding: 13px 18px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      background:
        rgba(8, 12, 28, 0.70);

      backdrop-filter: blur(18px);

      -webkit-backdrop-filter:
        blur(18px);

      border:
        1px solid var(--border);

      border-radius: 18px;
    }

    .logo {

      display: flex;

      align-items: center;

      gap: 10px;

      font-weight: 800;

      letter-spacing: -0.5px;
    }

    .logo-icon {

      width: 35px;
      height: 35px;

      display: grid;

      place-items: center;

      border-radius: 10px;

      background:
        linear-gradient(
          135deg,
          var(--primary),
          var(--secondary)
        );

      box-shadow:
        0 0 25px
        rgba(139, 92, 246, 0.35);
    }

    .home-link {

      padding: 9px 14px;

      border:
        1px solid var(--border);

      border-radius: 10px;

      font-size: 13px;

      color: var(--muted);

      transition: 0.25s ease;
    }

    .home-link:hover {

      color: white;

      background:
        rgba(255,255,255,0.08);

      transform:
        translateY(-2px);
    }


    /* =========================
       ERROR CONTENT
    ========================== */

    main {

      position: relative;

      z-index: 2;

      flex: 1;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 70px 20px;
    }

    .error-container {

      width: min(
        760px,
        100%
      );

      text-align: center;

      padding: 60px 35px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.075),
          rgba(255,255,255,0.025)
        );

      border:
        1px solid var(--border);

      border-radius: 30px;

      backdrop-filter:
        blur(20px);

      -webkit-backdrop-filter:
        blur(20px);

      box-shadow:
        0 30px 100px
        rgba(0,0,0,0.40);

      animation:
        appear 0.8s ease;
    }

    @keyframes appear {

      from {

        opacity: 0;

        transform:
          translateY(25px)
          scale(0.98);
      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }

    }


    /* =========================
       404 NUMBER
    ========================== */

    .error-number {

      font-size:
        clamp(100px, 20vw, 190px);

      line-height: 0.85;

      font-weight: 900;

      letter-spacing: -10px;

      margin-bottom: 30px;

      background:

        linear-gradient(
          135deg,
          #ffffff 10%,
          #b9a4ff 45%,
          #67e8f9 90%
        );

      -webkit-background-clip: text;

      background-clip: text;

      color: transparent;

      filter:
        drop-shadow(
          0 15px 40px
          rgba(139, 92, 246, 0.20)
        );
    }


    /* =========================
       ICON
    ========================== */

    .error-icon {

      width: 70px;
      height: 70px;

      display: grid;

      place-items: center;

      margin:
        0 auto 25px;

      border-radius: 20px;

      background:
        rgba(139, 92, 246, 0.12);

      border:
        1px solid
        rgba(139, 92, 246, 0.25);

      font-size: 30px;

      box-shadow:
        0 10px 35px
        rgba(139, 92, 246, 0.15);
    }


    /* =========================
       TEXT
    ========================== */

    h1 {

      font-size:
        clamp(28px, 5vw, 44px);

      letter-spacing: -1.5px;

      margin-bottom: 14px;
    }

    .description {

      max-width: 540px;

      margin:
        0 auto 30px;

      color: var(--muted);

      line-height: 1.75;

      font-size: 15px;
    }


    /* =========================
       BUTTON
    ========================== */

    .buttons {

      display: flex;

      justify-content: center;

      gap: 12px;

      flex-wrap: wrap;
    }

    .btn {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 9px;

      padding:
        14px 22px;

      border-radius: 13px;

      font-size: 14px;

      font-weight: 700;

      border:
        1px solid var(--border);

      transition:
        0.25s ease;
    }

    .btn-primary {

      background:
        linear-gradient(
          135deg,
          var(--primary),
          #6d5dfc
        );

      box-shadow:
        0 12px 35px
        rgba(139, 92, 246, 0.30);
    }

    .btn-primary:hover {

      transform:
        translateY(-4px);

      box-shadow:
        0 18px 45px
        rgba(139, 92, 246, 0.42);
    }

    .btn-secondary {

      background:
        rgba(255,255,255,0.05);

      color: var(--muted);
    }

    .btn-secondary:hover {

      color: white;

      background:
        rgba(255,255,255,0.10);

      transform:
        translateY(-4px);
    }


    /* =========================
       FOOTER
    ========================== */

    footer {

      position: relative;

      z-index: 2;

      text-align: center;

      padding:
        25px 20px 30px;

      color:
        #7883a0;

      font-size: 12px;
    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 600px) {

      nav {

        margin-top: 12px;
      }

      .error-container {

        padding:
          45px 20px;
      }

      .error-number {

        letter-spacing: -6px;
      }

      .error-icon {

        width: 60px;
        height: 60px;

        font-size: 25px;
      }

      .buttons {

        flex-direction: column;
      }

      .btn {

        width: 100%;
      }

    }

  </style>

</head>


<body>


  <!-- Background effects -->

  <div class="glow glow-one"></div>

  <div class="glow glow-two"></div>


  <!-- =========================
       NAVIGATION
  ========================== -->

  <nav>

    <a
      href="index.html"
      class="logo"
    >

      <span class="logo-icon">
        ☁
      </span>

      <span>
        CloudCraft
      </span>

    </a>


    <a
      href="index.html"
      class="home-link"
    >
      Home →
    </a>

  </nav>


  <!-- =========================
       ERROR CONTENT
  ========================== -->

  <main>

    <div class="error-container">


      <div class="error-number">
        404
      </div>


      <div class="error-icon">
        🔍
      </div>


      <h1>
        Page Not Found
      </h1>


      <p class="description">

        Oops! The page you're looking for
        doesn't exist, may have been moved,
        or is temporarily unavailable.

        <br><br>

        Don't worry — let's get you back
        to the cloud.

      </p>


      <div class="buttons">


        <a
          href="index.html"
          class="btn btn-primary"
        >
          ← Back to Home
        </a>


        <a
          href="index.html#projects"
          class="btn btn-secondary"
        >
          Explore Projects ↗
        </a>


      </div>


    </div>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer>

    © 2026 CloudCraft ·
    Hosted on Amazon S3 ☁️

  </footer>


</body>
</html>
